name: Freshness check

# Advisory, deliberately. The checker is network-dependent (it fetches every
# official INOTEX page) and its exit code is a *finding*, not a build result:
# 2 = a source page changed (human review task), 3 = a source unreachable.
# A red X on an advisory would train the owner to ignore the Actions tab,
# which is why every step here is continue-on-error and nothing gates CI.
on:
  schedule:
    # Mondays 06:00 UTC — Sunday-morning publishing on the official site is
    # caught the next morning, Tehran time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stdlib only (urllib + hashlib), so no requirements install. Snapshots
      # land in the ephemeral workspace; the report is uploaded below.
      - name: Run the INOTEX freshness check
        continue-on-error: true
        run: python scripts/refresh-inotex-context.py

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: content/freshness-report.json
          if-no-files-found: warn
