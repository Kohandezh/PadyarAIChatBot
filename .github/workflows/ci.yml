name: CI

on:
  push:
    branches: [main, main-noor]
  pull_request:
  # Manual trigger: "Run workflow" button (Actions tab) or
  # `gh workflow run CI --ref main`. Same gates, same deploy — the only way
  # this differs from a push is who asked.
  workflow_dispatch:

jobs:
  # GitHub-hosted runners (ubuntu-latest) need a working billing account.
  # This repo's account has none, so every job here runs on the self-hosted
  # runner already registered on gpuserver for `deploy` (see
  # deploy/50-install-github-runner.sh) instead. One physical runner means
  # jobs that used to run in parallel now queue — slower, not broken.
  test:
    runs-on: [self-hosted, padyar]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-dev.txt, not a hand-listed subset. The hand-listed one
      # drifted: tests/test_booth_videos.py imports openpyxl at module level,
      # which made pytest ERROR during collection and stop the entire suite,
      # while every developer's machine had the package and stayed green.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # The browser tests skip themselves when chromium is missing, so without
      # this step CI reports a pass it did not earn. They are the only check
      # that sees a DOM defect: the "New chat" button once wiped #loading-bubble
      # and left a permanently dead chat screen, and every source-string
      # assertion in the suite stayed green through it.
      #
      # No --with-deps here: the gh-runner system user has exactly one sudo
      # privilege (running padyar-deploy) and --with-deps needs apt-get as
      # root. Chromium's shared libraries must already be on gpuserver — run
      # once, by hand, with sudo:
      #   python -m playwright install-deps chromium
      #
      # PLAYWRIGHT_DOWNLOAD_HOST: gpuserver's IP is geo-blocked by the
      # official cdn.playwright.dev (403 "not available in your location" —
      # same reason this project proxies OpenAI through GapGPT). npmmirror's
      # binary mirror is reachable and carries the same builds; verified
      # 2026-08-30 against build cft/151.0.7922.34.
      - name: Install chromium for the browser tests
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.npmmirror.com/binaries/playwright
        run: python -m playwright install chromium

      - name: Compile check
        run: |
          python -m py_compile app/main.py app/routers/chat.py app/services/openai.py

      # No --ignore. tests/e2e used to be excluded because one sync-Playwright
      # fixture kept an event loop alive and broke 126 unrelated tests; the
      # browser tests use the async api now, and tests/test_suite_isolation.py
      # fails if either half of that rule is undone.
      - name: Run test suite
        run: pytest -q

  # Blocking. These assert properties that must never regress: the assistant
  # must not answer confidently from the previous event's identity, must not
  # echo a secret, and must not be talked into either by a prompt-injection
  # question. run_eval.py exits non-zero when any of those gates trips.
  #
  # Runs after `test` so a plain broken build fails on the cheap job first.
  evaluation:
    runs-on: [self-hosted, padyar]
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Retrieval evaluation + safety gates
        env:
          # The harness is fully offline; a dummy key only satisfies import-time config.
          OPENAI_API_KEY: ci-dummy-key
          # Deterministic: never let CI seed content into a DB the harness then measures.
          SEED_DEFAULT_CONTENT: "true"
        run: python scripts/run_eval.py

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: docs/knowledge-based-evidence/appendices/benchmark-results/retrieval-eval.json
          if-no-files-found: warn

  # Reporting, NOT blocking. An advisory can name a fix version that has not
  # been published yet (see docs/engineering/DEPENDENCY_AUDIT.md — that is the
  # live situation for `cryptography` right now), and a build that hard-fails
  # on an unfixable finding is a build nobody can ship. A human reads this and
  # decides whether the finding is reachable.
  dependency-audit:
    runs-on: [self-hosted, padyar]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --progress-spinner off || true

      - name: Audit dependencies (machine-readable)
        run: pip-audit -r requirements.txt --progress-spinner off --format json --output pip-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json
          if-no-files-found: warn

  # Cheap, blocking, and catches the class of mistake that actually happened on
  # this project: a secret pasted into a tracked file.
  secret-scan:
    runs-on: [self-hosted, padyar]
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real .env is committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git — it must stay ignored."
            exit 1
          fi
          echo ".env is not tracked — ok"

      - name: Fail on credential-looking values in tracked files
        run: python3 scripts/secret_scan.py

      # The scanner is only worth having if it still fires. This proves it on a
      # throwaway file rather than trusting that a clean run means a working
      # check — a scanner that silently stopped matching would look identical
      # to a clean repository.
      - name: Prove the scanner still catches a real key
        run: |
          printf 'K = "sk-proj-7Kq2mVx9Lp4RtZw8Nb3Yc6Hd1Fg5Js0Aa"\n' > _scan_canary.py
          git add -N _scan_canary.py
          if python3 scripts/secret_scan.py; then
            echo "::error::the secret scanner did NOT catch a planted key."
            rm -f _scan_canary.py
            exit 1
          fi
          rm -f _scan_canary.py
          git rm -q --cached _scan_canary.py 2>/dev/null || true
          echo "scanner correctly rejected a planted key — ok"

  # ── Auto-deploy ────────────────────────────────────────────────────────
  # The production server runs a self-hosted runner (deploy/50-install-
  # github-runner.sh, label `padyar`) that dials OUT to GitHub, so nothing
  # inbound opens on the server. This job runs ON that server.
  #
  # Gate 1: every CI job above must be green.
  # Gate 2: the `production` environment holds a required-reviewer approval
  #         (repo Settings → Environments → production). One click per
  #         deploy; set it up once after installing the runner.
  #
  # The job does exactly one privileged thing: call the root-owned deploy
  # script with the ephemeral job token in its environment. No credential is
  # stored on the server; the token dies when the job ends.
  deploy:
    needs: [test, evaluation, dependency-audit, secret-scan]
    # Push to main deploys; so does a manual dispatch ON main (the button is
    # the operator saying "deploy the current main again" — same gates).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, padyar]
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # queue merges; never race two deploys
    steps:
      - name: Deploy inotex to production
        run: |
          set -euo pipefail
          sudo PADYAR_GIT_TOKEN="${{ github.token }}" \
            /usr/local/bin/padyar-deploy inotex "${{ github.sha }}"

      # Second install, same host, same script, same order of operations.
      # Deliberately SEQUENTIAL, not `strategy: matrix`: the two deploys share
      # one host, one PostgreSQL and one pip cache — a matrix would run them
      # concurrently and the restarts would interleave. If elecomp fails, the
      # job fails red with inotex already (independently) deployed and rolled
      # back only by its own health gate — each install's safety is its own.
      - name: Deploy elecomp to production
        run: |
          set -euo pipefail
          sudo PADYAR_GIT_TOKEN="${{ github.token }}" \
            /usr/local/bin/padyar-deploy elecomp "${{ github.sha }}"

      - name: Report
        run: |
          echo "Deployed ${{ github.sha }}:"
          echo "  - padyar-inotex  (inotex.padyar.com,  port 8001)"
          echo "  - padyar-elecomp (elecomp.padyar.com, port 8002)"
