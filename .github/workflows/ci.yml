name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: "Run workflow" button (Actions tab) or
  # `gh workflow run CI --ref main`. Same gates. The only way this differs
  # from a push is who asked.
  workflow_dispatch:

jobs:
  # Every job runs on GitHub-hosted ubuntu-latest runners. Nothing runs on
  # the production server: there is no self-hosted job and no auto-deploy.
  # Production is deployed by hand on the server with
  # `sudo /usr/local/bin/padyar-deploy <slug> <port> <sha>`
  # (deploy/README.md, "Deploying a new version").
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-dev.txt, not a hand-listed subset. The hand-listed one
      # drifted: tests/test_booth_videos.py imports openpyxl at module level,
      # which made pytest ERROR during collection and stop the entire suite,
      # while every developer's machine had the package and stayed green.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # pdftotext reads uploaded PDFs in the ingest module. Without it the PDF
      # tests in tests/test_ingest_extract.py skip, and CI would report a pass
      # it did not earn.
      - name: Install poppler-utils for the PDF tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # The browser tests skip themselves when chromium is missing, so without
      # this step CI reports a pass it did not earn. They are the only check
      # that sees a DOM defect: the "New chat" button once wiped #loading-bubble
      # and left a permanently dead chat screen, and every source-string
      # assertion in the suite stayed green through it. Hosted runners have
      # passwordless sudo and can reach the official playwright CDN, so
      # --with-deps works and no mirror is needed.
      - name: Install chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      # tests/test_eval_harness.py drives scripts/run_eval.py in a subprocess,
      # which loads the pinned embedding model. data/models is gitignored, so
      # without this the suite downloads 513 MB on every run. Same key as the
      # evaluation job below, so whichever finishes first fills the cache.
      - name: Cache the pinned embedding model
        uses: actions/cache@v4
        with:
          path: data/models
          key: model2vec-potion-multilingual-128M-73908c3438cf03b6a01bcb9611d62b23d0726f08

      - name: Compile check
        run: |
          python -m py_compile app/main.py app/routers/chat.py app/services/openai.py

      # No --ignore. tests/e2e used to be excluded because one sync-Playwright
      # fixture kept an event loop alive and broke 126 unrelated tests; the
      # browser tests use the async api now, and tests/test_suite_isolation.py
      # fails if either half of that rule is undone.
      #
      # Coverage is ADVISORY: no --cov-fail-under, ever. A number that gates
      # gets gamed (tests written to touch lines, not to pin behavior); a
      # number that only reports can afford to be honest.
      - name: Run test suite
        run: pytest -q --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  # Blocking. Real PostgreSQL 16, same image and same credentials as
  # docker-compose.yml, so the five bug classes that are invisible on SQLite
  # (see tests/postgres/conftest.py) run on every push and PR instead of only
  # on a developer machine that happens to have a local server.
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: padyar_app
          POSTGRES_PASSWORD: padyar_local_dev
          POSTGRES_DB: padyar
        ports:
          - 5432:5432
        # Same probe as docker-compose.yml. The suite's throwaway-schema
        # fixtures connect through DATABASE_URL below; without the health
        # check the first connection races the container's initdb and the
        # whole job fails on a bootstrap race, not on a defect.
        options: >-
          --health-cmd "pg_isready -U padyar_app -d padyar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUN_POSTGRES_TESTS: "1"
      DATABASE_URL: postgresql://padyar_app:padyar_local_dev@127.0.0.1:5432/padyar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # psycopg[binary] and psycopg-pool come from requirements.txt — the
      # production driver, not a dev extra; the suite skips itself without it.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Same system package as the test job (knowledge-ingestion SPEC, REQ-015),
      # so a PostgreSQL test that reads a PDF runs instead of skipping.
      - name: Install poppler-utils for the PDF tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # The service container starts empty, but the suite assumes a
      # dev-machine-shaped database: test_isolation.py probes the LIVE
      # app.dataset to prove the harness never writes there, and the session
      # guard snapshots live table counts. So provision the real schemas the
      # same way deploy/05-create-databases.sh does on a server — create the
      # app/observability schemas, then apply the real migrations into them.
      - name: Provision live schemas for the isolation probes
        run: |
          psql "$DATABASE_URL" -c 'CREATE SCHEMA IF NOT EXISTS app; CREATE SCHEMA IF NOT EXISTS observability;'
          python scripts/apply_migrations.py
      - name: Run PostgreSQL integration suite
        run: pytest tests/postgres -q

  # The alert rules against the promtool the host runs. ubuntu-24.04 (not
  # ubuntu-latest) because the host is Ubuntu noble and its archive has
  # Prometheus 2.45: a rule file that passes promtool 3.x proves nothing about
  # 2.45. The tests read `promtool --version` and skip with that reason when
  # the version differs. This job runs only tests/test_monitoring_rules.py;
  # the `test` job runs it too, where the promtool cases skip.
  monitoring-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install promtool from the Ubuntu archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends prometheus

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run the monitoring rule tests
        run: |
          promtool --version
          pytest tests/test_monitoring_rules.py -q -rs

  # The encrypted off-site copy (sftp: target) against a real SFTP-only server
  # (atmoz/sftp) and a real pg_dump (postgres:16), both started by the test
  # itself with `docker run`. ubuntu-24.04 because the host is Ubuntu noble:
  # the sftp and gpg clients here are the ones production runs.
  # OFFSITE_SFTP_LIVE=1 turns "docker or a tool is missing" into a failure
  # instead of a skip, so this job cannot pass without running the proof.
  offsite-sftp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run the off-site copy tests
        env:
          OFFSITE_SFTP_LIVE: "1"
        run: pytest tests/test_offsite_sftp_live.py tests/test_offsite_panel_live.py tests/test_backup_offsite.py -q -rs

  # Reporting, NOT blocking. An advisory can name a fix version that has not
  # been published yet, and a build that hard-fails on an unfixable finding is
  # a build nobody can ship. A human reads this and decides whether the finding
  # is reachable. See docs/engineering/DEPENDENCY_AUDIT.md for the method and
  # the history. The `cryptography` case that motivated this policy is CLOSED:
  # the fix shipped in 50.0.0 and requirements.txt now resolves clean.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --progress-spinner off || true

      - name: Audit dependencies (machine-readable)
        run: pip-audit -r requirements.txt --progress-spinner off --format json --output pip-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json
          if-no-files-found: warn

  # Cheap, blocking, and catches the class of mistake that actually happened on
  # this project: a secret pasted into a tracked file.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real .env is committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git — it must stay ignored."
            exit 1
          fi
          echo ".env is not tracked — ok"

      - name: Fail on credential-looking values in tracked files
        run: python3 scripts/secret_scan.py

      # The scanner is only worth having if it still fires. This proves it on a
      # throwaway file rather than trusting that a clean run means a working
      # check — a scanner that silently stopped matching would look identical
      # to a clean repository.
      - name: Prove the scanner still catches a real key
        run: |
          printf 'K = "sk-proj-7Kq2mVx9Lp4RtZw8Nb3Yc6Hd1Fg5Js0Aa"\n' > _scan_canary.py
          git add -N _scan_canary.py
          if python3 scripts/secret_scan.py; then
            echo "::error::the secret scanner did NOT catch a planted key."
            rm -f _scan_canary.py
            exit 1
          fi
          rm -f _scan_canary.py
          git rm -q --cached _scan_canary.py 2>/dev/null || true
          echo "scanner correctly rejected a planted key — ok"

  # Blocking. The local retrieval layer — the tiered pipeline, hand-written
  # BM25, the feature reranker, the per-install intent head — is the part of
  # this product that is NOT a wrapper around somebody else's model. Until this
  # job existed none of it was provable from a clean clone: scripts/run_eval.py
  # is a real harness, but the golden set it needs was deleted with the event
  # install it belonged to (4c4303f), app/default_content.py ships empty on
  # purpose, and no job ever called the script. Every recall number in
  # docs/engineering/ was therefore unreproducible.
  #
  # It runs OFFLINE against the committed fixtures in data/eval/: no AI
  # provider, no customer data, no install database. It exits non-zero when a
  # mode drops below one of its measured floors in data/eval/floors.json (or
  # breaks an enforced control), and when the contamination or secret-leak
  # gate trips. That is what makes it a gate rather than a report.
  evaluation:
    runs-on: ubuntu-latest
    env:
      # Empty, not unset: a regression that starts reaching for a provider has
      # to fail here rather than quietly fall back to one.
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt only. The harness imports the app's own services, not
      # pytest or Playwright.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # data/models is gitignored (the pinned weights are 513 MB), so a fresh
      # runner has no model and fetches it once. The key is the EXACT snapshot
      # pinned in app/services/embeddings.py (DEFAULT_MODEL_REVISION): a looser
      # key would serve different weights on a later run and silently change a
      # ranking — which is why that revision is a pin in the first place.
      # tests/test_eval_harness.py fails if the key stops matching it.
      - name: Cache the pinned embedding model
        uses: actions/cache@v4
        with:
          path: data/models
          key: model2vec-potion-multilingual-128M-73908c3438cf03b6a01bcb9611d62b23d0726f08

      - name: Compile check
        run: python -m py_compile scripts/run_eval.py

      # Every mode, each against its own floors in data/eval/floors.json
      # (docs/features/eval-benchmark/SPEC.md). A mode that breaks a floor, a
      # ceiling or an enforced control exits 1; a broken input exits 2. All
      # five run even when one fails, so one red run shows every regression.
      - name: Run the retrieval benchmark in every mode
        run: |
          status=0
          for mode in full full_no_intent hybrid dense bm25; do
            echo "::group::mode $mode"
            python scripts/run_eval.py \
              --golden data/eval/golden.json \
              --mode "$mode" \
              --recall-k 1,3,5,8,13 \
              --check data/eval/floors.json \
              --out "retrieval-eval-$mode.json" \
              --dump "retrieval-eval-$mode-dump.json" || status=1
            echo "::endgroup::"
          done
          exit $status

      # The numbers in docs/features/eval-benchmark/RESULTS.md are only
      # checkable if the runs that produced them are downloadable. The dumps
      # carry the per-query evidence: what the router served, and why each
      # deny-case was refused.
      - name: Upload the benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: retrieval-eval-*.json
          if-no-files-found: warn

  # Blocking. The retired event brands must not come back: every scrubbed
  # surface (source, tests, scripts, docs) stays scrubbed. Each allowlist is
  # the kept-by-design set for that brand — the inotex THEME and its assets,
  # the checksum-guarded migrations, the pet characters' own folders, the
  # removal specs, the AI assistance log, and run_eval.py's contamination
  # guard.
  identity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The retired event brands must not return
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep >/dev/null
          # The character classes (INO[T]EX etc.) keep this job's own pattern
          # line from matching itself — the search stays repo-wide otherwise.
          # Fail closed: exit 1 (no matches) is the ONLY passing outcome. An
          # rg error (bad regex, I/O failure → exit 2) must fail the job, not
          # silently pass it.
          set +e
          rg -n 'INO[T]EX|این[و]تکس|inotex[.]com|inotex[.]padyar|padyar[-]inotex|secure[-]panel[-]inotex' \
            --hidden -g '!node_modules' -g '!.git' \
            -g '!themes/**' -g '!migrations/**' \
            -g '!static/otp/pet/characters/inotex/**' \
            -g '!docs/superpowers/**'
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "::error::Retired event brand found outside the allowlist"; exit 1
          elif [ "$code" -ne 1 ]; then echo "::error::rg itself failed (exit $code) — guard cannot run"; exit 1
          else echo "clean"; fi
          # The second retired event brand, same pattern, same fail-closed
          # semantics. Allowlist: the pet character's own folder, the
          # checksum-guarded migrations, docs/superpowers, the AI assistance
          # log, and run_eval.py's LEGACY_TOKENS (a kept-by-design
          # contamination guard for retired-brand names in legacy data).
          set +e
          rg -n '[eE]lecomp|ELE[C]OMP|ال[ک]امپ' \
            --hidden -g '!node_modules' -g '!.git' \
            -g '!static/otp/pet/characters/**' \
            -g '!migrations/**' \
            -g '!docs/superpowers/**' \
            -g '!docs/engineering/AI_ASSISTANCE_LOG.md' \
            -g '!scripts/run_eval.py'
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "::error::Retired event brand found outside the allowlist"; exit 1
          elif [ "$code" -ne 1 ]; then echo "::error::rg itself failed (exit $code) — guard cannot run"; exit 1
          else echo "clean"; fi
