name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: "Run workflow" button (Actions tab) or
  # `gh workflow run CI --ref main`. Same gates, same deploy — the only way
  # this differs from a push is who asked.
  workflow_dispatch:

jobs:
  # The repo is public, so GitHub-hosted runners are free and unlimited.
  # All checks run on ubuntu-latest and parallelize again. Only `deploy`
  # stays on the self-hosted `padyar` runner on gpuserver (see below).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-dev.txt, not a hand-listed subset. The hand-listed one
      # drifted: tests/test_booth_videos.py imports openpyxl at module level,
      # which made pytest ERROR during collection and stop the entire suite,
      # while every developer's machine had the package and stayed green.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # The browser tests skip themselves when chromium is missing, so without
      # this step CI reports a pass it did not earn. They are the only check
      # that sees a DOM defect: the "New chat" button once wiped #loading-bubble
      # and left a permanently dead chat screen, and every source-string
      # assertion in the suite stayed green through it. Hosted runners have
      # passwordless sudo and can reach the official playwright CDN, so
      # --with-deps works and no mirror is needed.
      - name: Install chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Compile check
        run: |
          python -m py_compile app/main.py app/routers/chat.py app/services/openai.py

      # No --ignore. tests/e2e used to be excluded because one sync-Playwright
      # fixture kept an event loop alive and broke 126 unrelated tests; the
      # browser tests use the async api now, and tests/test_suite_isolation.py
      # fails if either half of that rule is undone.
      #
      # Coverage is ADVISORY: no --cov-fail-under, ever. A number that gates
      # gets gamed (tests written to touch lines, not to pin behavior); a
      # number that only reports can afford to be honest.
      - name: Run test suite
        run: pytest -q --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  # Blocking. Real PostgreSQL 16, same image and same credentials as
  # docker-compose.yml, so the five bug classes that are invisible on SQLite
  # (see tests/postgres/conftest.py) run on every push and PR instead of only
  # on a developer machine that happens to have a local server.
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: padyar_app
          POSTGRES_PASSWORD: padyar_local_dev
          POSTGRES_DB: padyar
        ports:
          - 5432:5432
        # Same probe as docker-compose.yml. The suite's throwaway-schema
        # fixtures connect through DATABASE_URL below; without the health
        # check the first connection races the container's initdb and the
        # whole job fails on a bootstrap race, not on a defect.
        options: >-
          --health-cmd "pg_isready -U padyar_app -d padyar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUN_POSTGRES_TESTS: "1"
      DATABASE_URL: postgresql://padyar_app:padyar_local_dev@127.0.0.1:5432/padyar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # psycopg[binary] and psycopg-pool come from requirements.txt — the
      # production driver, not a dev extra; the suite skips itself without it.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # The service container starts empty, but the suite assumes a
      # dev-machine-shaped database: test_isolation.py probes the LIVE
      # app.dataset to prove the harness never writes there, and the session
      # guard snapshots live table counts. So provision the real schemas the
      # same way deploy/05-create-databases.sh does on a server — create the
      # app/observability schemas, then apply the real migrations into them.
      - name: Provision live schemas for the isolation probes
        run: |
          psql "$DATABASE_URL" -c 'CREATE SCHEMA IF NOT EXISTS app; CREATE SCHEMA IF NOT EXISTS observability;'
          python scripts/apply_migrations.py
      - name: Run PostgreSQL integration suite
        run: pytest tests/postgres -q

  # Reporting, NOT blocking. An advisory can name a fix version that has not
  # been published yet, and a build that hard-fails on an unfixable finding is
  # a build nobody can ship. A human reads this and decides whether the finding
  # is reachable. See docs/engineering/DEPENDENCY_AUDIT.md for the method and
  # the history. The `cryptography` case that motivated this policy is CLOSED:
  # the fix shipped in 50.0.0 and requirements.txt now resolves clean.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --progress-spinner off || true

      - name: Audit dependencies (machine-readable)
        run: pip-audit -r requirements.txt --progress-spinner off --format json --output pip-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json
          if-no-files-found: warn

  # Cheap, blocking, and catches the class of mistake that actually happened on
  # this project: a secret pasted into a tracked file.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real .env is committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git — it must stay ignored."
            exit 1
          fi
          echo ".env is not tracked — ok"

      - name: Fail on credential-looking values in tracked files
        run: python3 scripts/secret_scan.py

      # The scanner is only worth having if it still fires. This proves it on a
      # throwaway file rather than trusting that a clean run means a working
      # check — a scanner that silently stopped matching would look identical
      # to a clean repository.
      - name: Prove the scanner still catches a real key
        run: |
          printf 'K = "sk-proj-7Kq2mVx9Lp4RtZw8Nb3Yc6Hd1Fg5Js0Aa"\n' > _scan_canary.py
          git add -N _scan_canary.py
          if python3 scripts/secret_scan.py; then
            echo "::error::the secret scanner did NOT catch a planted key."
            rm -f _scan_canary.py
            exit 1
          fi
          rm -f _scan_canary.py
          git rm -q --cached _scan_canary.py 2>/dev/null || true
          echo "scanner correctly rejected a planted key — ok"

  # ── Auto-deploy ────────────────────────────────────────────────────────
  # The production server runs a self-hosted runner (deploy/50-install-
  # github-runner.sh, label `padyar`) that dials OUT to GitHub, so nothing
  # inbound opens on the server. This job runs ON that server. It stays
  # self-hosted now that the repo is public: the `if` below limits it to
  # push/dispatch on main (write access required), so fork pull requests
  # can never schedule code onto the server runner — and the production
  # environment approval is a second gate on top of that.
  #
  # Gate 1: every blocking CI job (including the identity-guard below) must
  # be green.
  # Gate 2: the `production` environment holds a required-reviewer approval
  #         (repo Settings → Environments → production). One click per
  #         deploy; set it up once after installing the runner.
  #
  # The job does exactly one privileged thing: call the root-owned deploy
  # script with the ephemeral job token in its environment. No credential is
  # stored on the server; the token dies when the job ends.
  deploy:
    needs: [test, postgres-tests, dependency-audit, secret-scan, identity-guard]
    # Push to main deploys; so does a manual dispatch ON main (the button is
    # the operator saying "deploy the current main again" — same gates).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, padyar]
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # queue merges; never race two deploys
    steps:
      # The install this host serves is named by repository variables, so
      # one workflow deploys any install. If the deploy fails, the job fails
      # red and the install is rolled back by its own health gate.
      - name: Deploy to production
        run: |
          set -euo pipefail
          # Fail closed, like every other gate in this file: a deploy
          # without a configured target is a misconfiguration, not a no-op.
          # DEPLOY_SLUG/DEPLOY_PORT live in repo Settings → Secrets and
          # variables → Actions → Variables (DEPLOY_PORT is the install's
          # APP_PORT — the port its systemd unit listens on).
          if [ -z "${{ vars.DEPLOY_SLUG }}" ] || [ -z "${{ vars.DEPLOY_PORT }}" ]; then
            echo "::error::DEPLOY_SLUG and DEPLOY_PORT repository variables are not set. Configure them in Settings → Secrets and variables → Actions → Variables, then re-run."
            exit 1
          fi
          sudo PADYAR_GIT_TOKEN="${{ github.token }}" \
            /usr/local/bin/padyar-deploy "${{ vars.DEPLOY_SLUG }}" "${{ vars.DEPLOY_PORT }}" "${{ github.sha }}"

      - name: Report
        run: |
          echo "Deployed ${{ github.sha }}:"
          echo "  - padyar-${{ vars.DEPLOY_SLUG }} (port ${{ vars.DEPLOY_PORT }})"

  # Blocking. The retired event brands must not come back: every scrubbed
  # surface (source, tests, scripts, docs) stays scrubbed. Each allowlist is
  # the kept-by-design set for that brand — the inotex THEME and its assets,
  # the checksum-guarded migrations, the pet characters' own folders, the
  # removal specs, the AI assistance log, and run_eval.py's contamination
  # guard.
  identity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The retired event brands must not return
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep >/dev/null
          # The character classes (INO[T]EX etc.) keep this job's own pattern
          # line from matching itself — the search stays repo-wide otherwise.
          # Fail closed: exit 1 (no matches) is the ONLY passing outcome. An
          # rg error (bad regex, I/O failure → exit 2) must fail the job, not
          # silently pass it.
          set +e
          rg -n 'INO[T]EX|این[و]تکس|inotex[.]com|inotex[.]padyar|padyar[-]inotex|secure[-]panel[-]inotex' \
            --hidden -g '!node_modules' -g '!.git' \
            -g '!themes/**' -g '!migrations/**' \
            -g '!static/otp/pet/characters/inotex/**' \
            -g '!docs/superpowers/**'
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "::error::Retired event brand found outside the allowlist"; exit 1
          elif [ "$code" -ne 1 ]; then echo "::error::rg itself failed (exit $code) — guard cannot run"; exit 1
          else echo "clean"; fi
          # The second retired event brand, same pattern, same fail-closed
          # semantics. Allowlist: the pet character's own folder, the
          # checksum-guarded migrations, docs/superpowers, the AI assistance
          # log, and run_eval.py's LEGACY_TOKENS (a kept-by-design
          # contamination guard for retired-brand names in legacy data).
          set +e
          rg -n '[eE]lecomp|ELE[C]OMP|ال[ک]امپ' \
            --hidden -g '!node_modules' -g '!.git' \
            -g '!static/otp/pet/characters/**' \
            -g '!migrations/**' \
            -g '!docs/superpowers/**' \
            -g '!docs/engineering/AI_ASSISTANCE_LOG.md' \
            -g '!scripts/run_eval.py'
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "::error::Retired event brand found outside the allowlist"; exit 1
          elif [ "$code" -ne 1 ]; then echo "::error::rg itself failed (exit $code) — guard cannot run"; exit 1
          else echo "clean"; fi
