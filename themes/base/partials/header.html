<header>
    <div class="logo-container">
        <div class="the-slogan">
            <div class="header-title">{{ app_title }}</div>
            <div class="header-subtitle">{{ wl_subtitle }}</div>
        </div>
    </div>

    <div class="header-tools">
        <!-- "New chat" moved into the drawer's sidebar (menu.html) as a
             labelled row — always the first item, like every ChatGPT-style
             sidebar. Language, text size, and everything else that used to
             live here still opens via the button below. See
             docs/features/hamburger-menu/SPEC.md. -->
        <button class="menu-toggle" id="menu-toggle" type="button" aria-haspopup="dialog"
            aria-controls="menu-drawer" aria-expanded="false"
            data-i18n-title="menuTitle" title="منو" aria-label="منو">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <line x1="4" x2="20" y1="6" y2="6" />
                <line x1="4" x2="20" y1="12" y2="12" />
                <line x1="4" x2="20" y1="18" y2="18" />
            </svg>
        </button>
    </div>
</header>
