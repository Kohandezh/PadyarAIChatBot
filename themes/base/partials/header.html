<header>
    <div class="logo-container">
        <div class="the-slogan">
            <div class="header-title">دستیار پادیار</div>
            <div class="header-subtitle">INOTEX</div>
        </div>
    </div>

    <!-- Language switch -->
    <div class="lang-switch">
        <button class="lang-btn" id="lang-btn" type="button" aria-label="Switch to English"
            title="Switch to English">EN</button>
    </div>

    <div class="accessibility-controls">
        <button class="a11y-hamburger" id="a11y-hamburger" title="تنظیمات دسترسی‌پذیری"
            aria-label="Accessibility settings" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" x2="20" y1="6" y2="6" />
                <line x1="4" x2="20" y1="12" y2="12" />
                <line x1="4" x2="20" y1="18" y2="18" />
            </svg>
        </button>

        <div class="a11y-dropdown" id="a11y-dropdown">
            <div class="a11y-dropdown-content">
                <button class="a11y-btn" onclick="adjustFontSize(1)" title="افزایش سایز متن"
                    aria-label="Increase font size">A+</button>
                <button class="a11y-btn" onclick="adjustFontSize(-1)" title="کاهش سایز متن"
                    aria-label="Decrease font size">A-</button>
            </div>
        </div>
    </div>
</header>
