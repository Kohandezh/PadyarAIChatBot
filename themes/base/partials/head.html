<meta charset="UTF-8">
<meta name="chat-token" content="{{ chat_token }}">
<meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>{{ app_title }}</title>
<!-- ?v= is a cache-buster: the value is the newest mtime of the two stylesheets
     (see _asset_version in app/routers/public.py). Without it browsers keep
     serving the pre-upgrade CSS, so customers see broken styling after a theme
     update. The token changes only when a stylesheet changes, so normal visits
     still hit the browser cache. -->
<link href="/static/chat/base.css?v={{ asset_version | default('0', true) }}" rel="stylesheet" type="text/css" />
<link href="/themes/{{ theme_name }}/static/style.css?v={{ asset_version | default('0', true) }}" rel="stylesheet" type="text/css" />
<link href="/static/vendor/vazirmatn/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<script src="/static/vendor/marked/marked.min.js"></script>
<!-- marked turns an answer into HTML; it does not remove anything dangerous,
     and it dropped its own sanitize option years ago. Since the lead-capture
     flow an answer's text can originate outside the building: an exhibitor
     contact proposes it, an admin approves it from a screen that escapes it
     correctly, and it then renders in every visitor's chat. DOMPurify is what
     strips the executable parts before that HTML reaches the page. It must
     load with marked, on every theme, or the theme that misses it is the one
     the attack uses. -->
<script src="/static/vendor/dompurify/purify.min.js"></script>
