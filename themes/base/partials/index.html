<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    {% include "head.html" %}
</head>

<!-- Chat is the default view: it is the part of the product that actually
     answers people. The video tab opens only once INOTEX media is connected. -->
<body>

    <!-- Colour mode, applied BEFORE anything paints.
         The themes that have a light mode (inotex, liquid-glass) are dark by
         default and switch with `body.light-mode`, and their toggles live at
         the bottom of footer.html — far too late: the page would paint dark
         and then flip. Resolving it here, on the first line inside <body>,
         means the very first paint is already right.

         Precedence, and it is the same in the footer toggles: an explicit
         choice this visitor made wins; with nothing stored the device's own
         setting decides. The two keys are the two themes' own storage keys;
         a theme with no light mode simply has neither, and the class it would
         set means nothing in its CSS. -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('inotex-light-mode');   /* inotex: '1' | '0' */
                var glass = localStorage.getItem('inotex-theme');         /* liquid-glass: 'light' | 'dark' */
                var light = stored !== null ? stored === '1'
                    : glass !== null ? glass === 'light'
                        : window.matchMedia('(prefers-color-scheme: light)').matches;
                if (light) document.body.classList.add('light-mode');
            } catch (e) { /* storage blocked — the dark default stands */ }
        })();
    </script>

    <!-- Included BEFORE .app-layout on purpose: below the desktop breakpoint
         (static/chat/base.css, 992px) this is a `position: fixed` overlay so
         DOM order does not matter, but at and above it `body` becomes a flex
         row and this becomes a real sidebar sitting beside .app-layout — DOM
         order IS visual order there. `body` stays `dir="rtl"`, so the first
         flex child renders at the physical right, which is exactly where the
         mobile overlay already anchors (`right: 0`). Reorder this and the
         sidebar silently jumps to the wrong side on desktop only. -->
    {% include "menu.html" %}

    <div class="app-layout">
        {% include "header.html" %}

        <div class="view-container">
            {% include "messages.html" %}
            {% include "suggestions.html" %}
            {% include "video.html" %}
        </div>

        {% include "input.html" %}
    </div>

    {% include "footer.html" %}
</body>

</html>
