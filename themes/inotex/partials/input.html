<!-- Input Area (INOTEX composer) -->
<div class="wrapper">
    <div id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="سوال خود را بنویسید..." rows="3"
                autocomplete="off" lang="fa" dir="auto"></textarea>
            <button id="mic-btn" class="mic-btn" title="تایپ صوتی" aria-label="Voice input">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                    fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <button id="send-btn" title="ارسال پیام" aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor"></path>
                </svg>
            </button>
            <span class="composer-studs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </div>

        <!-- Powered-by credit: anchored under the input, never floating over
             the chat. Text and colour are the install's own (Settings >
             Branding → متن/رنگ پایین صفحه). -->
        <div class="rayen-sidebar-foot" role="note">
            <img src="/LOGO/rayen-logo.png" alt="راین" width="18" height="18">
            <span>{{ wl_footer_text }}</span>
        </div>
    </div>
</div>
