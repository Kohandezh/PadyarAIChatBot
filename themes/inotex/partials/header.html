<header class="inx-header">
    <!-- Chat / Video segmented switcher (brick pill) -->
    <fieldset class="switcher" c-previous="1">
        <legend class="switcher__legend">انتخاب نما</legend>
        <label class="switcher__option">
            <input class="switcher__input" type="radio" name="tab" value="text" c-option="1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path
                    d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" />
            </svg>
            <span data-i18n="textTab">چت</span>
        </label><label class="switcher__option">
            <input class="switcher__input" type="radio" name="tab" value="video" c-option="2" checked="">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" />
                <rect x="2" y="6" width="14" height="12" rx="2" />
            </svg>
            <span data-i18n="videoTab">ویدیو</span>
        </label>
    </fieldset>

    <div class="header-tools">
        <!-- "New chat" moved into the drawer's sidebar (menu.html) as a
             labelled row — always the first item, like every ChatGPT-style
             sidebar. Light/dark, language and text size still live in the
             drawer menu.html opens. See docs/features/hamburger-menu/SPEC.md. -->
        <button class="menu-toggle" id="menu-toggle" type="button" aria-haspopup="dialog"
            aria-controls="menu-drawer" aria-expanded="false"
            data-i18n-title="menuTitle" title="منو" aria-label="منو">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <line x1="4" x2="20" y1="6" y2="6" />
                <line x1="4" x2="20" y1="12" y2="12" />
                <line x1="4" x2="20" y1="18" y2="18" />
            </svg>
        </button>
    </div>
</header>
