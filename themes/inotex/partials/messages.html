<!-- Text Chat View (INOTEX brick cards) -->
<div id="text-view" class="tab-view active" role="tabpanel" aria-label="چت متنی">
    <div id="chat-view-content">
        <div class="message bot" id="welcome-message">
            <div class="bubble">
                <span class="bubble-mark" aria-hidden="true"></span>
                <div class="bubble-text" id="welcome-text" dir="auto">{{ wl_welcome }}</div>
            </div>
        </div>

        <!-- Always-visible question menu: the user can start with one click -->
        <div id="suggest-menu" class="suggest-menu" hidden>
            <div class="suggest-title" id="suggest-title" dir="auto" data-i18n="suggestTitle">می‌توانید یکی از این‌ها را انتخاب کنید:</div>
            <div class="suggest-chips" id="suggest-chips" role="list"></div>
        </div>

        <!-- Loading Bubble -->
        <div class="message bot" id="loading-bubble">
            <div class="bubble">
                <span class="bubble-mark" aria-hidden="true"></span>
                <div class="bubble-text">
                    <div class="ai-loader" role="status" aria-live="polite">
                        <span class="ai-loader-studs" aria-hidden="true"><i></i><i></i><i></i></span>
                        <span class="ai-loader-label" data-i18n="generating">در حال نوشتن پاسخ</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
