<!-- Hamburger drawer menu — everything that used to sit in the inx-header, in
     one place: chats → language → light/dark → text size → account.

     Layout: #menu-history is the flexible, independently-scrolling region
     (see static/chat/base.css) — a visitor scrolls INSIDE the "my chats"
     list to page in more, the drawer itself does not scroll. .menu-footer
     holds every other row and is pinned to the bottom of the drawer
     regardless of how tall or short the history list is. Each row inside
     .menu-footer is admin-toggleable — see app/services/menu_settings.py /
     Settings → برندینگ. -->
<div class="menu-backdrop" id="menu-backdrop"></div>
<nav class="menu-drawer" id="menu-drawer" data-i18n-aria-label="menuTitle" aria-label="منو">
    <!-- Desktop-only sidebar header: brand + collapse toggle (hidden below
         the 992px breakpoint — static/chat/base.css). Expanded, the logo and
         toggle sit side by side; collapsed, the logo itself IS the toggle
         (hover swaps it to the rail icon — see .menu-sidebar-toggle-logo). -->
    <div class="menu-sidebar-header" id="menu-sidebar-header">
        <!-- Moved from header.html — inotex no longer shows a header logo,
             the full brand mark + title now lives here instead. -->
        <div class="logo-container" aria-hidden="true">
            <div class="the-slogan">
                <div class="header-title" data-i18n="app_title">{{ app_title }}</div>
                <div class="header-subtitle">{{ wl_subtitle }}</div>
            </div>
        </div>
        <button type="button" class="menu-sidebar-toggle-btn" id="menu-sidebar-toggle"
            aria-expanded="true" aria-label="جمع کردن منو" title="جمع کردن منو">
            <div class="menu-sidebar-toggle-logo">
                <!-- A set whitelabel_logo_url REPLACES the hexagon mark (owner
                     decision): one identity, not two competing ones. Empty
                     default keeps the SVG mark — pixel-identical to today. -->
                {% if wl_logo_url %}
                <img class="brand-mark" src="{{ wl_logo_url }}" alt="{{ app_title }}" width="38" height="38">
                {% else %}
                <!-- INOTEX hexagon-cube interface motif (conceptual mark from the
                     coordinated visual system — not the official event logo). -->
                <svg class="brand-mark" viewBox="0 0 64 64" width="38" height="38"
                    role="img" aria-label="INOTEX">
                    <defs>
                        <linearGradient id="inxHex" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#2D5CA7" />
                            <stop offset="0.72" stop-color="#1E2D52" />
                            <stop offset="1" stop-color="#FCB715" />
                        </linearGradient>
                    </defs>
                    <path d="M32 3 57 17.5v29L32 61 7 46.5v-29Z" fill="#1E2D52"
                        stroke="url(#inxHex)" stroke-width="3" stroke-linejoin="round" />
                    <path d="M32 17 45 24.5v15L32 47 19 39.5v-15Z" fill="#2D5CA7" />
                    <path d="M32 17 45 24.5 32 32 19 24.5Z" fill="#5B8AD9" />
                    <path d="M32 32v15L19 39.5v-15Z" fill="#24487F" />
                    <path d="M32 47 45 39.5v-6.2L32 40.8Z" fill="#FCB715" />
                </svg>
                {% endif %}
            </div>
            <span class="menu-sidebar-toggle-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="9" y1="3" x2="9" y2="21" />
                </svg>
            </span>
        </button>
    </div>

    <button type="button" class="menu-drawer-close" id="menu-close"
        data-i18n-title="closeMenu" title="بستن منو" aria-label="بستن منو" data-menu-close>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
    </button>

    <!-- New chat — always the first row, signed in or not, mobile or
         desktop. Same id the header used to hold; core.js's handler is
         getElementById-driven, so relocating it changed nothing there. -->
    <button type="button" class="menu-newchat-btn" id="new-chat-btn" data-menu-close
        data-i18n-title="newChat" title="گفتگوی جدید" aria-label="گفتگوی جدید">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        <span data-i18n="newChat">گفتگوی جدید</span>
    </button>

    <!-- My chats. Hidden until a signed-in visitor's list actually has rows
         (static/chat/core.js refreshMenuHistory()); paginated 10 at a time,
         more loading on scroll inside this section. -->
    <div class="menu-section" id="menu-history" hidden>
        <ul class="menu-history-list" id="menu-history-list"></ul>
    </div>

    <div class="menu-footer" id="menu-footer">
        {% if menu_show_language %}
        <div class="menu-section">
            <div class="menu-row">
                <span class="menu-row-label">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="2" y1="12" x2="22" y2="12" />
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z" />
                    </svg>
                    <span data-i18n="languageLabel">زبان</span>
                </span>
                <div class="lang-switch">
                    <button class="lang-btn" id="lang-btn" type="button" aria-label="Switch to English"
                        title="Switch to English">EN</button>
                </div>
            </div>
        </div>
        {% endif %}

        {% if menu_show_theme_toggle %}
        <div class="menu-section">
            <div class="menu-row">
                <span class="menu-row-label">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                        <circle cx="12" cy="12" r="4" />
                    </svg>
                    <span data-i18n="themeLabel">روشن / تاریک</span>
                </span>
                <!-- Light / dark switch. Present in the previous header and carried
                     forward here unchanged (same id, same core.js-independent
                     wiring in footer.html) — only its container moved. -->
                <button class="theme-btn" id="theme-btn" type="button" aria-pressed="false"
                    title="حالت روشن" data-i18n-title="themeToggle" aria-label="Switch to light mode">
                    <span class="theme-icon-moon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
                        </svg>
                    </span>
                    <span class="theme-icon-sun" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2" /><path d="M12 20v2" />
                            <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
                            <path d="M2 12h2" /><path d="M20 12h2" />
                            <path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
                        </svg>
                    </span>
                </button>
            </div>
        </div>
        {% endif %}

        {% if menu_show_text_size %}
        <div class="menu-section">
            <div class="menu-row">
                <span class="menu-row-label">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 7V4h16v3" />
                        <path d="M9 20h6" />
                        <path d="M12 4v16" />
                    </svg>
                    <span data-i18n="textSizeLabel">اندازه متن</span>
                </span>
                <div class="menu-a11y-buttons">
                    <button class="a11y-btn" type="button" onclick="adjustFontSize(1)" title="افزایش سایز متن"
                        data-i18n-title="fontInc" aria-label="Increase font size">A+</button>
                    <button class="a11y-btn" type="button" onclick="adjustFontSize(-1)" title="کاهش سایز متن"
                        data-i18n-title="fontDec" aria-label="Decrease font size">A-</button>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Account (login/logout) — populated by static/companion/registration.js
             only when the registration module is enabled, a visitor is signed
             in, AND the admin has not turned the row off (data-show-logout). -->
        <div class="menu-section" id="menu-account-section"
            data-show-logout="{{ 'true' if menu_show_logout else 'false' }}"></div>
    </div>
</nav>
