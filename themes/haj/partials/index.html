<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    {% include "head.html" %}
</head>

<!-- Haj theme — the shell, in reading order.
     TopBar → SegmentedTabs (inside the bar) → QuickActionRow → the main panel
     (hero visual beside the conversation) → InputComposer → SecurityFooter.
     Every one of those is its own partial so a customer can replace one part
     without touching the rest. -->
<body class="haj">

    <!-- Colour mode, applied BEFORE anything paints. The toggle at the bottom
         of footer.html owns the control; this only resolves the same answer
         early enough that the first paint is already correct instead of
         flipping once the footer runs.

         Precedence (identical in the footer): a choice this visitor made wins;
         with nothing stored the device's own setting decides. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('haj-color-mode');
                var dark = saved === null
                    ? window.matchMedia('(prefers-color-scheme: dark)').matches
                    : saved === 'dark';
                if (dark) document.body.classList.add('haj-dark');
            } catch (e) { /* storage blocked — the light default stands */ }
        })();
    </script>

    {% include "pattern.html" %}

    <!-- The bar spans the whole viewport; only the chatbot below it sits in
         the centred column. -->
    {% include "header.html" %}

    <div class="app-layout haj-shell">

        <!-- One chatbot: the conversation, the box you type into and the
             suggested questions are the same object, inside one frame. Only
             the companion lives outside it. -->
        <div class="haj-chatbox">
            <div class="view-container haj-stage">
                {% include "messages.html" %}
                {% include "video.html" %}
            </div>

            {% include "input.html" %}
            {% include "chips.html" %}
        </div>
        {% include "security.html" %}
    </div>

    {% include "menu.html" %}

    {% include "footer.html" %}
</body>

</html>
