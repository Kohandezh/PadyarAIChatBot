<!-- Text chat view: HeroVisualPanel beside ConversationPanel. -->
<div id="text-view" class="tab-view active" role="tabpanel" aria-label="گفت‌وگوی متنی">
    <div class="haj-panel">

        <!-- HeroVisualPanel ────────────────────────────────────────────
             Drawn, not photographed: flat geometric silhouettes in the brand
             blues. A holy place is treated as architecture in the distance —
             no faces, no characters, no ornamentation played for charm. The
             whole panel is decorative and says so, so a screen reader moves
             straight to the conversation. -->
        <aside class="haj-hero" aria-hidden="true">
            <!-- Photographic hero (light mode, tall layout): the mock's misty
                 light-blue Masjid al-Haram, alpha-feathered so it melts into
                 the panel. The drawing below takes over in dark mode and in
                 the wide band, where a photo slice would show only ground. -->
            <img class="haj-hero-photo" src="/themes/haj/static/hero-kaaba.webp" alt=""
                loading="lazy" decoding="async" />
            <!-- Night counterpart for the dark palette: same composition,
                 lamp-lit. CSS shows exactly one of the two. -->
            <img class="haj-hero-photo haj-hero-photo-dark" src="/themes/haj/static/hero-kaaba-dark.webp"
                alt="" loading="lazy" decoding="async" />
            <svg class="haj-hero-art" viewBox="0 0 460 780" preserveAspectRatio="xMidYMax slice"
                focusable="false" role="presentation">

                <!-- birds -->
                <g class="haj-art-birds" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round">
                    <path d="M52 128c8-8 12-8 18 0" />
                    <path d="M74 128c8-8 12-8 18 0" />
                    <path d="M96 96c7-7 11-7 16 0" />
                    <path d="M318 110c8-8 12-8 18 0" />
                    <path d="M344 86c7-7 11-7 16 0" />
                </g>

                <!-- far minarets -->
                <g class="haj-art-far">
                    <path d="M52 640V212a18 18 0 0 1 18 0v428Z" />
                    <path d="M61 206c-9-16-9-28 0-42 9 14 9 26 0 42Z" />
                    <rect x="46" y="300" width="30" height="9" rx="4" />
                    <path d="M296 640V262a16 16 0 0 1 16 0v378Z" />
                    <path d="M304 256c-8-14-8-25 0-38 8 13 8 24 0 38Z" />
                    <rect x="291" y="342" width="27" height="8" rx="4" />
                    <path d="M388 640V232a17 17 0 0 1 17 0v408Z" />
                    <path d="M396 226c-8-15-8-26 0-40 8 14 8 25 0 40Z" />
                    <rect x="382" y="318" width="29" height="9" rx="4" />
                </g>

                <!-- mosque: main block, onion dome, side domes, arcade -->
                <g class="haj-art-mid">
                    <path d="M132 640V434h196v206Z" />
                    <path d="M164 434c0-64 20-116 66-146 46 30 66 82 66 146Z" />
                    <path d="M228 290c-4-14-4-24 0-34 4 10 4 20 0 34Z" />
                    <path d="M141 470c0-30 12-52 32-64 20 12 32 34 32 64Z" />
                    <path d="M255 470c0-30 12-52 32-64 20 12 32 34 32 64Z" />
                </g>
                <g class="haj-art-arch">
                    <path d="M150 640v-42c0-14 9-24 20-24s20 10 20 24v42Z" />
                    <path d="M200 640v-42c0-14 9-24 20-24s20 10 20 24v42Z" />
                    <path d="M250 640v-42c0-14 9-24 20-24s20 10 20 24v42Z" />
                    <path d="M300 640v-42c0-14 9-24 20-24s20 10 20 24v42Z" />
                </g>

                <!-- the Kaaba, in the foreground: one plain cube and its band -->
                <g class="haj-art-fore">
                    <polygon class="haj-art-cube-top" points="150,470 250,440 350,470 250,500" />
                    <polygon class="haj-art-cube-a" points="150,470 250,500 250,700 150,670" />
                    <polygon class="haj-art-cube-b" points="250,500 350,470 350,670 250,700" />
                    <polygon class="haj-art-band" points="150,532 250,562 250,594 150,564" />
                    <polygon class="haj-art-band" points="250,562 350,532 350,564 250,594" />
                    <polygon class="haj-art-door" points="300,586 324,579 324,648 300,656" />
                </g>

                <ellipse class="haj-art-ground" cx="250" cy="702" rx="182" ry="18" />
            </svg>

            <!-- The same scene, composed wide. A tall drawing cannot be
                 cropped into a short band without showing only the ground, so
                 the narrow layouts get a horizon of their own rather than a
                 slice of this one. Only ever one of the two is displayed. -->
            <svg class="haj-hero-art haj-hero-art-wide" viewBox="0 0 960 200"
                preserveAspectRatio="xMidYMax slice" focusable="false" role="presentation">

                <g class="haj-art-birds" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round">
                    <path d="M232 46c6-6 9-6 13 0" />
                    <path d="M252 34c5-5 8-5 12 0" />
                    <path d="M694 40c6-6 9-6 13 0" />
                </g>

                <g class="haj-art-far">
                    <path d="M96 178V64a11 11 0 0 1 12 0v114Z" />
                    <path d="M102 60c-6-11-6-19 0-29 6 10 6 18 0 29Z" />
                    <path d="M148 178V84a10 10 0 0 1 11 0v94Z" />
                    <path d="M153 80c-5-9-5-16 0-25 5 9 5 16 0 25Z" />
                    <path d="M804 178V64a11 11 0 0 1 12 0v114Z" />
                    <path d="M810 60c-6-11-6-19 0-29 6 10 6 18 0 29Z" />
                    <path d="M856 178V84a10 10 0 0 1 11 0v94Z" />
                    <path d="M861 80c-5-9-5-16 0-25 5 9 5 16 0 25Z" />
                </g>

                <g class="haj-art-mid">
                    <path d="M192 178v-60h168v60Z" />
                    <path d="M214 118c0-27 12-46 62-52 50 6 62 25 62 52Z" />
                    <path d="M276 64c-3-8-3-14 0-20 3 6 3 12 0 20Z" />
                    <path d="M600 178v-60h168v60Z" />
                    <path d="M622 118c0-27 12-46 62-52 50 6 62 25 62 52Z" />
                    <path d="M684 64c-3-8-3-14 0-20 3 6 3 12 0 20Z" />
                </g>

                <g class="haj-art-arch">
                    <path d="M208 178v-24c0-9 6-15 13-15s13 6 13 15v24Z" />
                    <path d="M254 178v-24c0-9 6-15 13-15s13 6 13 15v24Z" />
                    <path d="M300 178v-24c0-9 6-15 13-15s13 6 13 15v24Z" />
                    <path d="M616 178v-24c0-9 6-15 13-15s13 6 13 15v24Z" />
                    <path d="M662 178v-24c0-9 6-15 13-15s13 6 13 15v24Z" />
                    <path d="M708 178v-24c0-9 6-15 13-15s13 6 13 15v24Z" />
                </g>

                <g class="haj-art-fore">
                    <polygon class="haj-art-cube-top" points="415,88 480,70 545,88 480,106" />
                    <polygon class="haj-art-cube-a" points="415,88 480,106 480,178 415,160" />
                    <polygon class="haj-art-cube-b" points="480,106 545,88 545,160 480,178" />
                    <polygon class="haj-art-band" points="415,110 480,128 480,141 415,123" />
                    <polygon class="haj-art-band" points="480,128 545,110 545,123 480,141" />
                    <polygon class="haj-art-door" points="524,131 538,127 538,154 524,158" />
                </g>

                <ellipse class="haj-art-ground" cx="480" cy="179" rx="210" ry="9" />
            </svg>
        </aside>

        <!-- ConversationPanel ──────────────────────────────────────────
             The transcript. `role="log"` + `aria-live` so a new answer is
             announced instead of appearing silently. -->
        <div class="haj-conversation">
            <div id="chat-view-content" role="log" aria-live="polite" aria-relevant="additions"
                aria-label="تاریخچه گفت‌وگو">

                <!-- Welcome. Its copy is theme-owned (see HajCopy in footer.html)
                     so it names this service, and it is re-applied whenever the
                     language changes. -->
                <div class="message bot" id="welcome-message">
                    <div class="bubble">
                        <span class="haj-badge" aria-hidden="true">
                            <img src="/themes/haj/static/app-icon.png" width="30" height="30" alt="" />
                        </span>
                        <div class="haj-bubble-body">
                            <div class="bubble-text" id="haj-welcome" dir="auto">سلام و خوش آمدید. من دستیار
                                هوشمند سازمان حج و زیارت هستم. هر پرسشی درباره ثبت‌نام، مدارک، هزینه‌ها و
                                خدمات سفر دارید، همین‌جا بپرسید.</div>
                        </div>
                    </div>
                </div>

                <!-- Assistant typing state. core.js fades this in while an
                     answer is being written. -->
                <div class="message bot" id="loading-bubble">
                    <div class="bubble">
                        <span class="haj-badge" aria-hidden="true">
                            <img src="/themes/haj/static/app-icon.png" width="30" height="30" alt="" />
                        </span>
                        <div class="haj-bubble-body">
                            <div class="haj-typing" role="status">
                                <span class="haj-typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                                <span class="haj-typing-label" id="haj-typing-label">در حال آماده‌کردن پاسخ…</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
