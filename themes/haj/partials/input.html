<!-- InputComposer.
     DOM order is the visual left-to-right order (mic, speaker, keyboard,
     input, send); the row is reversed in CSS so that order survives RTL.
     Every icon button is 56px — a target an unsteady hand can hit — and every
     one of them says what it does in its accessible name, because an icon
     alone is a guess for a first-time user. -->
<div class="wrapper haj-composer-wrap">
    <div id="input-area" class="haj-composer-area">
        <div class="input-wrapper haj-composer" id="haj-composer" data-voice="idle">

            <button type="button" id="mic-btn" class="mic-btn haj-icon-btn haj-icon-btn-primary"
                title="پرسیدن با صدا" aria-label="پرسیدن با صدا" aria-pressed="false">
                <svg class="haj-ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="2" width="6" height="12" rx="3" />
                    <path d="M19 11a7 7 0 0 1-14 0" />
                    <path d="M12 18v4M8.5 22h7" />
                </svg>
            </button>

            <button type="button" id="tts-btn" class="tts-btn haj-icon-btn" title="خواندن پاسخ‌ها با صدا"
                aria-label="خواندن پاسخ‌ها با صدا" aria-pressed="false">
                <svg class="haj-ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="11 5 6 9 3 9 3 15 6 15 11 19 11 5" />
                    <path class="haj-tts-wave" d="M15.5 9a4 4 0 0 1 0 6" />
                    <path class="haj-tts-wave" d="M18.5 6a8 8 0 0 1 0 12" />
                </svg>
            </button>

            <button type="button" id="haj-keyboard-btn" class="haj-icon-btn" title="نوشتن با صفحه‌کلید"
                aria-label="نوشتن با صفحه‌کلید">
                <svg class="haj-ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="5.5" width="20" height="13" rx="3" />
                    <path d="M6 9.5h.01M10 9.5h.01M14 9.5h.01M18 9.5h.01M6 13h.01M18 13h.01M9 16h6" />
                    <path d="M9.5 13h5" />
                </svg>
            </button>

            <label class="haj-sr-only" for="user-input">پرسش شما درباره خدمات حج و زیارت</label>
            <textarea id="user-input" class="haj-input" rows="1" lang="fa" dir="auto" autocomplete="off"
                enterkeyhint="send" placeholder="سؤال خود را درباره خدمات حج و زیارت بپرسید..."
                aria-describedby="haj-composer-hint"></textarea>

            <button type="button" id="send-btn" class="haj-send" title="ارسال پرسش" aria-label="ارسال پرسش">
                <svg class="haj-ic" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                    xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2 .01 7Z" />
                </svg>
            </button>
        </div>

        <!-- Live description of what the composer is doing right now: listening,
             sending, or reporting a problem. Announced, never only coloured. -->
        <p class="haj-composer-hint" id="haj-composer-hint" role="status" aria-live="polite"></p>
    </div>
</div>
