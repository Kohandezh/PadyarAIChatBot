<!-- TopBar — brand on the reading side (right in RTL), controls opposite.
     Everything here is a real, labelled control: a pilgrim who has never used
     a chatbot should be able to see what each thing does without trying it. -->
<header class="haj-topbar">

    <!-- BrandHeader -->
    <div class="haj-brand">
        <img class="haj-brand-mark" src="/themes/haj/static/logo-mark.png" width="56" height="56"
            alt="نشان سازمان حج و زیارت" />
        <span class="haj-brand-text">
            <span class="haj-brand-title">دستیار هوشمند سازمان حج و زیارت</span>
            <span class="haj-brand-subtitle">پاسخ‌گوی هوشمند خدمات حج و زیارت</span>
        </span>
    </div>

    <!-- SegmentedTabs — two radios, so the choice is one control with two
         states rather than two buttons that happen to disagree. -->
    <fieldset class="haj-tabs">
        <legend class="haj-sr-only">انتخاب نمای گفت‌وگو</legend>

        <label class="haj-tab">
            <input class="haj-tab-input" type="radio" name="haj-view" value="text" checked>
            <span class="haj-tab-face">
                <svg class="haj-ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.8-5a8.3 8.3 0 0 1-.8-3.6 8.4 8.4 0 0 1 8.5-8.4h.5A8.4 8.4 0 0 1 21 11.5Z" />
                </svg>
                <span class="haj-tab-label" data-i18n="textTab">چت</span>
            </span>
        </label>

        <label class="haj-tab">
            <input class="haj-tab-input" type="radio" name="haj-view" value="video">
            <span class="haj-tab-face">
                <svg class="haj-ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 10.5" />
                    <rect x="2" y="6" width="14" height="12" rx="3" />
                </svg>
                <span class="haj-tab-label" data-i18n="videoTab">ویدیو</span>
            </span>
        </label>
    </fieldset>

    <div class="haj-topbar-tools">

        <!-- No language control: this install is Persian-only. The knowledge
             base is Persian (the official source publishes nothing else), so
             an English switch could only ever lead to Persian answers under an
             English label — a promise the content cannot keep. -->

        <!-- ThemeToggle — the icon pair stays visible so the control reads as
             "light or dark", and the knob says which one is on. A per-visitor
             preference: it never rewrites the install-wide active theme. -->
        <button type="button" class="haj-theme-toggle" id="haj-theme-toggle" role="switch" aria-checked="false"
            title="تغییر حالت روشن و تاریک" aria-label="تغییر حالت روشن و تاریک">
            <svg class="haj-ic haj-ic-moon" viewBox="0 0 24 24" width="20" height="20" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5Z" />
            </svg>
            <span class="haj-theme-track" aria-hidden="true"><span class="haj-theme-knob"></span></span>
            <svg class="haj-ic haj-ic-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
        </button>

        <!-- Text size. Wired by the shared core.js; kept in the top bar
             because a reader who needs bigger type needs it before they read
             anything else. -->
        <div class="accessibility-controls haj-a11y">
            <button class="haj-icon-btn a11y-hamburger" id="a11y-hamburger" type="button"
                title="اندازه متن" aria-label="اندازه متن"
                aria-expanded="false">
                <svg class="haj-ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <div class="a11y-dropdown haj-a11y-menu" id="a11y-dropdown">
                <div class="a11y-dropdown-content">
                    <button class="haj-a11y-btn a11y-btn" type="button" onclick="adjustFontSize(1)"
                        title="بزرگ‌تر کردن متن" aria-label="بزرگ‌تر کردن متن">A+</button>
                    <button class="haj-a11y-btn a11y-btn" type="button" onclick="adjustFontSize(-1)"
                        title="کوچک‌تر کردن متن" aria-label="کوچک‌تر کردن متن">A-</button>
                </div>
            </div>
        </div>
    </div>
</header>
