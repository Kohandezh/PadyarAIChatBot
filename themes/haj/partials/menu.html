<!-- Hamburger drawer menu — everything that used to sit in the haj-topbar, in
     one place: chats → light/dark → text size → account. No language row —
     this install is Persian-only by design (see haj/partials/header.html's
     own note on that).

     Layout: #menu-history is the flexible, independently-scrolling region
     (see static/chat/base.css) — a visitor scrolls INSIDE the "my chats"
     list to page in more, the drawer itself does not scroll. .menu-footer
     holds every other row and is pinned to the bottom of the drawer
     regardless of how tall or short the history list is. Each row inside
     .menu-footer is admin-toggleable — see app/services/menu_settings.py /
     Settings → برندینگ. -->
<div class="menu-backdrop" id="menu-backdrop"></div>
<nav class="menu-drawer" id="menu-drawer" aria-label="منو">
    <button type="button" class="menu-drawer-close" id="menu-close"
        title="بستن منو" aria-label="بستن منو" data-menu-close>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
    </button>

    <!-- My chats. Hidden until a signed-in visitor's list actually has rows
         (static/chat/core.js refreshMenuHistory()); paginated 10 at a time,
         more loading on scroll inside this section. -->
    <div class="menu-section" id="menu-history" hidden>
        <div class="menu-section-label">گفتگوهای من</div>
        <ul class="menu-history-list" id="menu-history-list"></ul>
    </div>

    <div class="menu-footer" id="menu-footer">
        {% if menu_show_theme_toggle %}
        <div class="menu-section">
            <div class="menu-row">
                <span class="menu-row-label">
                    <svg class="haj-ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5Z" />
                    </svg>
                    <span>روشن / تاریک</span>
                </span>
                <!-- ThemeToggle — unchanged id/markup, only its container moved. -->
                <button type="button" class="haj-theme-toggle" id="haj-theme-toggle" role="switch" aria-checked="false"
                    title="تغییر حالت روشن و تاریک" aria-label="تغییر حالت روشن و تاریک">
                    <svg class="haj-ic haj-ic-moon" viewBox="0 0 24 24" width="20" height="20" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5Z" />
                    </svg>
                    <span class="haj-theme-track" aria-hidden="true"><span class="haj-theme-knob"></span></span>
                    <svg class="haj-ic haj-ic-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                    </svg>
                </button>
            </div>
        </div>
        {% endif %}

        {% if menu_show_text_size %}
        <div class="menu-section">
            <div class="menu-row">
                <span class="menu-row-label">
                    <svg class="haj-ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="5.5" width="20" height="13" rx="3" />
                        <path d="M6 9.5h.01M10 9.5h.01M14 9.5h.01M18 9.5h.01M6 13h.01M18 13h.01M9 16h6" />
                    </svg>
                    <span>اندازه متن</span>
                </span>
                <div class="menu-a11y-buttons">
                    <button class="haj-a11y-btn a11y-btn" type="button" onclick="adjustFontSize(1)"
                        title="بزرگ‌تر کردن متن" aria-label="بزرگ‌تر کردن متن">A+</button>
                    <button class="haj-a11y-btn a11y-btn" type="button" onclick="adjustFontSize(-1)"
                        title="کوچک‌تر کردن متن" aria-label="کوچک‌تر کردن متن">A-</button>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Account (login/logout) — populated by static/companion/registration.js
             only when the registration module is enabled, a visitor is signed
             in, AND the admin has not turned the row off (data-show-logout). -->
        <div class="menu-section" id="menu-account-section"
            data-show-logout="{{ 'true' if menu_show_logout else 'false' }}"></div>
    </div>
</nav>
