<!-- DecorativePatternLayer — an Islamic geometric lattice, drawn once behind
     everything at very low opacity. It is inline SVG rather than a background
     image so its ink is a themed CSS class: the same layer reads correctly in
     the light and the dark palette without shipping two files. Purely
     decorative, so it is hidden from assistive tech and from the pointer. -->
<div class="haj-pattern" aria-hidden="true">
    <svg class="haj-pattern-svg" width="100%" height="100%" focusable="false" role="presentation">
        <defs>
            <pattern id="haj-geo" width="88" height="88" patternUnits="userSpaceOnUse">
                <g class="haj-pattern-ink" fill="none" stroke="currentColor" stroke-width="1"
                    stroke-linejoin="round">
                    <!-- Two squares, one rotated 45°: the eight-point star (خاتم) -->
                    <rect x="14" y="14" width="60" height="60" />
                    <polygon points="44,2 86,44 44,86 2,44" />
                    <!-- Quarter stars on the tile corners keep the lattice continuous -->
                    <polygon points="0,-42 42,0 0,42 -42,0" />
                    <polygon points="88,-42 130,0 88,42 46,0" />
                    <polygon points="0,46 42,88 0,130 -42,88" />
                    <polygon points="88,46 130,88 88,130 46,88" />
                </g>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#haj-geo)" />
    </svg>
</div>
