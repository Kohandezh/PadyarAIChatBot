<!-- Video view. Two clips, one element — the same arrangement the previous
     deployment used: `data-waiting-src` is the idle loop that plays on arrival
     and that core.js returns to after any answer, and `data-welcome-src` is
     the introduction, played once by the Start button (whose click is also
     what lets the browser play it with sound).

     Until an administrator drops the clips into media/videos/, the video
     element has nothing to load: the explanatory card stays up and the Start
     button removes itself rather than promising a film that does not exist. -->
<div id="video-view" class="tab-view" role="tabpanel" aria-label="گفت‌وگوی ویدیویی">
    <div class="avatar-container haj-video">
        <!-- Explanatory card, shown ONLY while there are no frames to show.
             The install this theme came from shipped its own clips, so it drew
             nothing here; this repo ships an empty media/videos/, so without
             the card a fresh install answers the Video tab with a black
             rectangle and no way to tell whether it is broken or just empty.
             The footer hides it the moment the video has real frames and
             brings it back on `error`/`emptied`, exactly as the inotex theme
             does — a fallback underneath the picture, never an overlay. -->
        <div class="video-placeholder haj-video-placeholder" id="video-placeholder">
            <div class="video-placeholder-card">
                <div class="video-placeholder-mark" aria-hidden="true">
                    <img src="/themes/haj/static/logo-mono.png" width="64" height="64" alt="" />
                </div>
                <p>ویدیوهای راهنمای زائران در این بخش نمایش داده می‌شوند</p>
                <span>برای پرسیدن سؤال، تب «چت» را انتخاب کنید.</span>
            </div>
        </div>

        <video id="avatar-video" muted loop playsinline
            data-waiting-src="/media/videos/idle.mp4"
            data-welcome-src="/media/videos/welcome.mp4"></video>

        <!-- Start: plays the introduction once, then hands back to the idle
             loop. One large, obvious target — this is the first thing an
             elderly visitor is asked to press. -->
        <button type="button" class="haj-video-start" id="video-start" hidden>
            <span class="haj-video-start-ring" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z" />
            </svg>
            <span class="haj-video-start-label" id="haj-video-start-label">پخش معرفی</span>
        </button>
    </div>
</div>
