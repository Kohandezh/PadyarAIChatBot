<header>
    <div class="liquidGlass-effect"></div>
    <div class="liquidGlass-tint"></div>
    <div class="liquidGlass-shine"></div>

    <div class="liquidGlass-text">
        <div class="logo-container">
            <div class="the-logo">
                <!-- INOTEX hexagon-cube interface motif (conceptual mark from the
                     coordinated visual system — not the official event logo). -->
                <svg class="brand-mark" viewBox="0 0 64 64" width="34" height="34"
                    role="img" aria-label="INOTEX">
                    <defs>
                        <linearGradient id="inxHex" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#2D5CA7" />
                            <stop offset="0.72" stop-color="#1E2D52" />
                            <stop offset="1" stop-color="#FCB715" />
                        </linearGradient>
                    </defs>
                    <path d="M32 3 57 17.5v29L32 61 7 46.5v-29Z" fill="#1E2D52"
                        stroke="url(#inxHex)" stroke-width="3" stroke-linejoin="round" />
                    <path d="M32 17 45 24.5v15L32 47 19 39.5v-15Z" fill="#2D5CA7" />
                    <path d="M32 17 45 24.5 32 32 19 24.5Z" fill="#5B8AD9" />
                    <path d="M32 32v15L19 39.5v-15Z" fill="#24487F" />
                    <path d="M32 47 45 39.5v-6.2L32 40.8Z" fill="#FCB715" />
                </svg>
            </div>
            <div class="the-slogan">
                <div class="header-title" data-i18n="app_title">{{ app_title }}</div>
                <div class="header-subtitle">{{ wl_subtitle }}</div>
            </div>
        </div>

        <!-- Liquid Glass Switcher — the original segmented control -->
        <fieldset class="switcher" c-previous="1">
            <legend class="switcher__legend">انتخاب نما</legend>

            <label class="switcher__option">
                <input class="switcher__input" type="radio" name="tab" value="video" c-option="2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" />
                    <rect x="2" y="6" width="14" height="12" rx="2" />
                </svg><span data-i18n="videoTab">چت ویدیویی</span>
            </label><label class="switcher__option">
                <input class="switcher__input" type="radio" name="tab" value="text" c-option="1" checked="">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" />
                </svg>
                <span data-i18n="textTab">چت متنی</span>
            </label>

            <div class="switcher__filter">
                <svg>
                    <filter id="switcher" primitiveUnits="objectBoundingBox">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="0.04" result="blur"></feGaussianBlur>
                        <feDisplacementMap id="disp" in="blur" in2="SourceGraphic" scale="0.5"
                            xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
                    </filter>
                </svg>
            </div>
        </fieldset>

        <div class="header-tools">
            <!-- "New chat" moved into the drawer's sidebar (menu.html) as a
                 labelled row — always the first item, like every ChatGPT-style
                 sidebar. Light/dark, language and text size still live in the
                 drawer menu.html opens. See docs/features/hamburger-menu/SPEC.md. -->
            <button class="menu-toggle" id="menu-toggle" type="button" aria-haspopup="dialog"
                aria-controls="menu-drawer" aria-expanded="false"
                data-i18n-title="menuTitle" title="منو" aria-label="منو">
                <div class="liquidGlass-effect"></div>
                <div class="liquidGlass-shine"></div>
                <span class="liquidGlass-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg>
                </span>
            </button>
        </div>
    </div>
</header>
