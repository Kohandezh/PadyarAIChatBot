# Catch-all for requests whose Host matches no site.
#
# Without this, nginx serves such a request from the FIRST server block it
# loaded — alphabetically elecomp — so hitting the server by bare IP, by an
# old hostname, or by an automated scan silently returns a customer's site.
# Once the tunnel makes this host public that stops being cosmetic: scanners
# probe by IP constantly, and every one of those hits would land on, and be
# logged as, real traffic to a customer install.
#
# 444 is nginx's "close the connection without a response" — the quietest
# possible answer to a request that was never addressed to us.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    # http2 must be repeated here. nginx takes the protocol options from the
    # FIRST listen it parses for a given address:port, and conf.d/ loads before
    # sites-enabled/. Omitting it here silently disables HTTP/2 for BOTH real
    # sites and emits only a "protocol options redefined" warning.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # A certificate is mandatory for an SSL listener even though we never
    # complete a useful handshake here. The snakeoil pair ships with Ubuntu's
    # ssl-cert package and is deliberately NOT one of the real certificates.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    return 444;
}
