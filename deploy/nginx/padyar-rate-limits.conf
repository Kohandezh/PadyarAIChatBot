# Shared L7 flood backstops for every Padyar site.
#
# Installed into /etc/nginx/conf.d/ (http context) by deploy/15-nginx-and-ssl.sh.
# The per-site server blocks reference these zones; nothing here fires on its
# own, so a site that opts out simply never mentions a zone.
#
# WHY THIS LIVES IN NGINX AND NOT THE APP
# ---------------------------------------
# The app already rate-limits what costs money (chat, transcription, OTP) with
# per-IP sliding windows in the database. That limiter cannot help against a
# flood of cheap GETs: every request still wakes a Python worker, and the
# endpoints that touch PostgreSQL (/api/health did a COUNT(*), /api/dataset a
# full scan) will exhaust the connection pool before any rate counter fills.
# nginx sheds that load before it reaches uvicorn. This is deliberately the
# COARSE layer — the app stays the fine-grained one — and it cannot replace a
# CDN against a real volumetric DDoS; it keeps a small botnet or a runaway
# script from taking the panel down with the chat.
#
# KEYING
# ------
# $binary_remote_addr, AFTER conf.d/cloudflare-realip.conf has restored the
# visitor's true address — without that file every visitor shares one Cloudflare
# IP and these limits would throttle the whole exhibition as one client.
#
# SIZING (per IP)
# ---------------
#   public zone: 10 r/s, burst 20 — a page view is ~3 requests (HTML + dataset
#     + questions) and the app's own chat limit is far stricter; this ceiling
#     only exists to shed floods.
#   admin zone: 5 r/s, burst 50 — an admin page load fires a burst of API GETs
#     (stats, sessions, settings) at once; the burst absorbs it while a flooder
#     still trips within a second.
#   connections: 20 concurrent per IP — a browser needs ~6; a slowloris-style
#     holder needs many more.

limit_req_zone $binary_remote_addr zone=padyar_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=padyar_admin:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=padyar_conn:10m;

# Flooded callers get the same status the app's own limiter returns, so one
# client-side handling path covers both layers.
limit_req_status 429;
limit_conn_status 429;

# Microcache for the two read-only knowledge-base endpoints. 15s: short enough
# that an admin edit shows up for the next visitor, long enough that a flood
# collapses into one origin request per interval (proxy_cache_lock).
proxy_cache_path /var/cache/nginx/padyar
                 levels=1:2
                 keys_zone=padyar_micro:10m
                 max_size=100m
                 inactive=10m
                 use_temp_path=off;
