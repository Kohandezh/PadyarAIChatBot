# inotex.padyar.com -> 127.0.0.1:8001
#
# Cloudflare sits in front of this host, so conf.d/cloudflare-realip.conf must
# be installed too — otherwise $remote_addr is a Cloudflare address and the
# app rate-limits the entire exhibition as one visitor.

upstream padyar_inotex {
    server 127.0.0.1:8001 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name inotex.padyar.com;

    # Leave ACME reachable over plain HTTP so an http-01 renewal keeps working
    # even if the DNS-01 credentials are ever rotated out.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 ships nginx 1.24, where `http2 on;` is not yet a directive
    # (it arrived in 1.25.1). The listen-parameter form works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name inotex.padyar.com;

    ssl_certificate     /etc/letsencrypt/live/inotex.padyar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inotex.padyar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Admin video upload. nginx's default is 1m, which turns every upload into
    # a 413 long before the application sees it.
    client_max_body_size 500m;
    client_body_timeout  300s;

    access_log /var/log/nginx/inotex.access.log;
    error_log  /var/log/nginx/inotex.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A dead or restarting app must never show a raw 502 to a visitor: this
    # static page is the last thing standing when uvicorn is gone (deploy
    # restarts, crashes). The APP's own 503 is deliberately NOT intercepted —
    # it carries the app's in-app maintenance state as JSON.
    proxy_intercept_errors on;
    error_page 502 504 =503 /__maintenance.html;

    location = /__maintenance.html {
        internal;
        root /var/www/padyar/maintenance/inotex;
        # add_header does not inherit into a block that declares its own, so
        # the server-level security headers must be repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
    }

    # Media is served by nginx, not by the Python workers: an exhibition video
    # streamed through uvicorn occupies a worker for the whole playback.
    location /media/ {
        alias /var/lib/padyar/inotex/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- L7 flood backstops -----------------------------------------------
    # Zones live in conf.d/padyar-rate-limits.conf. Rates there, not here.

    # Read-only knowledge base, changes only when an admin edits it. Cached
    # 15s so a flood collapses into one origin request per interval and the
    # database stops paying for every page view. limit_req still applies on
    # top: cache or not, one IP cannot open the firehose.
    location = /api/dataset {
        limit_req zone=padyar_public burst=20 nodelay;
        limit_conn padyar_conn 20;

        proxy_pass http://padyar_inotex;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_cache padyar_micro;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location = /api/questions {
        limit_req zone=padyar_public burst=20 nodelay;
        limit_conn padyar_conn 20;

        proxy_pass http://padyar_inotex;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_cache padyar_micro;
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # The rest of the public API (health, voice status, OTP/leads forms).
    # Cheap to serve but each request wakes a worker — flood-shed here.
    location /api/ {
        limit_req zone=padyar_public burst=20 nodelay;
        limit_conn padyar_conn 20;
        proxy_pass http://padyar_inotex;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    # The chat POST itself. Coarser than the app's own limiter (which is what
    # protects the AI budget); this only stops the flood from reaching Python.
    location = /chat {
        limit_req zone=padyar_public burst=20 nodelay;
        limit_conn padyar_conn 20;
        proxy_pass http://padyar_inotex;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    # Admin panel + API. One page load fires a burst of API GETs, so the
    # burst is generous — a flooder still trips within a second at 5 r/s.
    location /admin/ {
        limit_req zone=padyar_admin burst=50 nodelay;
        proxy_pass http://padyar_inotex;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    location /secure-panel-inotex {
        limit_req zone=padyar_admin burst=50 nodelay;
        proxy_pass http://padyar_inotex;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    location / {
        proxy_pass http://padyar_inotex;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OVERWRITE, never $proxy_add_x_forwarded_for.
        # app/auth/security.py:62 reads the FIRST entry of X-Forwarded-For, so
        # appending would let a visitor supply their own value and rotate past
        # CHAT_RATE_LIMIT at will.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # The Tier-2 AI fallback can outlast nginx's 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        proxy_buffering on;
    }
}
