<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>{{SITE_TITLE}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Vazirmatn, Tahoma, sans-serif;
    background: #f4f4f8;
    color: #1f2937;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
  }
  .card {
    background: #ffffff;
    max-width: 420px;
    width: 100%;
    padding: 48px 28px 36px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(30, 27, 75, 0.12);
  }
  .brand { font-size: 14px; color: #6b7280; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #1e1b4b; line-height: 1.7; margin-bottom: 12px; }
  p { font-size: 15px; color: #4b5563; line-height: 1.9; }
  footer { margin-top: 28px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">{{SITE_TITLE}}</div>
    <h1>چند دقیقه‌ای دیگر برمی‌گردیم.</h1>
    <p>در حال به‌روزرسانی هستیم؛ همین صفحه به‌زودی خودش دوباره بارگذاری می‌شود.</p>
    <footer>پادیار</footer>
  </main>
</body>
</html>
