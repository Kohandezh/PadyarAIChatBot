# Restore the visitor's real IP from Cloudflare.
#
# WHY THIS MATTERS HERE: padyar.com is proxied by Cloudflare (both subdomains
# resolve to 172.67.141.4). Without this file every request arrives from one of
# a handful of Cloudflare addresses, so:
#   * app/auth/security.py rate-limits ALL visitors as a single IP — the whole
#     exhibition shares one 20-requests-per-60-seconds budget, and
#   * the admin brute-force lockout blocks everyone at once.
#
# Refresh with: bash deploy/refresh-cloudflare-ips.sh   (ranges do change)
# Generated from https://www.cloudflare.com/ips-v4 and /ips-v6

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare Tunnel: cloudflared runs ON this host, so proxied requests reach
# nginx from the loopback address, not from a Cloudflare range. Without these
# two lines real_ip_header is ignored for tunnelled traffic and every visitor
# is recorded as 127.0.0.1 — collapsing the whole exhibition into one
# rate-limit bucket and one admin-lockout counter.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;

real_ip_header CF-Connecting-IP;
