{% extends "admin/base.html" %}

{% block title %}ورود{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/admin/css/login.css">
{% endblock %}

{% block content %}
<!-- Login Section -->
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-user-shield"></i>
            <h4>مدیریت چت‌بات اینوتکس</h4>
            <p class="text-muted small">برای ورود اطلاعات خود را وارد کنید</p>
        </div>
        <form id="login-form">
            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" id="username" class="form-control" placeholder="نام کاربری" required>
            </div>
            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="رمز عبور" required>
            </div>
            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="fas fa-question-circle"></i></span>
                <input type="text" id="sec-answer" class="form-control" placeholder="رنگ مورد علاوه؟" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login w-100 mt-3">ورود به سیستم</button>
            <div id="login-error" class="text-danger mt-3 text-center small"></div>
        </form>
    </div>
</div>
{% endblock %}

{% block page_js %}
<script type="module">
    import { initLogin } from '/static/admin/js/auth.js';
    initLogin();
</script>
{% endblock %}
