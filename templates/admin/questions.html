{% extends "admin/layout.html" %}

{% block title %}مدیریت سوالات{% endblock %}

{% block page_content %}
<!-- Topbar -->
<div class="topbar">
    <h5 class="m-0 text-dark">مدیریت سوالات</h5>
    <div class="user-profile">
        <span class="text-muted small">مدیر سیستم</span>
        <div class="user-avatar">A</div>
    </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex gap-2">
        <input type="text" id="questions-search" class="form-control" placeholder="جستجو در سوالات..." style="width: 250px; display: inline-block;">
        <select id="questions-filter-id" class="form-select" style="width: 200px;">
            <option value="">همه موضوعات</option>
        </select>
    </div>
    <div class="d-flex gap-2">
        <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown"><i class="fas fa-download me-1"></i> خروجی</button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" onclick="window.exportQuestions('json');return false;">فایل JSON</a></li>
                <li><a class="dropdown-item" href="#" onclick="window.exportQuestions('csv');return false;">فایل CSV (اکسل)</a></li>
            </ul>
        </div>
        <button class="btn btn-outline-secondary" onclick="window.openImportModal()"><i class="fas fa-upload me-1"></i> ورودی</button>
        <button class="btn btn-primary" onclick="window.openQuestionModal()"><i class="fas fa-plus me-1"></i> افزودن سوال</button>
    </div>
</div>
<div id="questions-bulk-toolbar" class="d-none d-flex align-items-center gap-2 mb-2 p-2 bg-light rounded border">
    <span id="questions-bulk-count" class="small fw-bold text-muted">0 مورد انتخاب شده</span>
    <button class="btn btn-outline-danger btn-sm" onclick="window.bulkDeleteQuestions()"><i class="fas fa-trash me-1"></i> حذف انتخاب‌شده‌ها</button>
</div>
<div class="content-card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="bg-light">
                    <tr>
                        <th style="width:40px"><input type="checkbox" id="questions-select-all" class="form-check-input"></th>
                        <th style="width:50px">#</th>
                        <th>سوال</th>
                        <th style="width:120px">شناسه دیتاست</th>
                        <th style="width:100px">عملیات</th>
                    </tr>
                </thead>
                <tbody id="questions-table"></tbody>
            </table>
        </div>
    </div>
    <div class="card-footer d-flex align-items-center">
        <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0" for="questions-page-size">تعداد در صفحه</label>
            <select id="questions-page-size" class="form-select form-select-sm" style="width:auto">
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <span class="text-muted" id="questions-range">—</span>
        </div>
        <div class="ms-auto">
            <button class="btn btn-outline-secondary" id="questions-btn-prev">قبلی</button>
            <button class="btn btn-outline-secondary" id="questions-btn-next">بعدی</button>
        </div>
    </div>
</div>
<div id="questions-msg" class="text-center fw-bold mt-2"></div>

<!-- Question Edit Modal -->
<div class="modal fade" id="questionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="questionModalTitle">افزودن سوال</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="q-edit-id">
                <div class="mb-3">
                    <label class="form-label">متن سوال</label>
                    <input type="text" id="q-edit-text" class="form-control" dir="rtl">
                </div>
                <div class="mb-3">
                    <label class="form-label">شناسه دیتاست</label>
                    <select id="q-edit-dataset-id" class="form-select"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                <button type="button" class="btn btn-primary" onclick="window.saveQuestion()">ذخیره</button>
            </div>
        </div>
    </div>
</div>

<!-- Import Modal -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-upload me-2"></i>وارد کردن سوالات</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">فایل (JSON یا CSV)</label>
                    <input type="file" id="import-file" class="form-control" accept=".json,.csv">
                </div>
                <label class="form-label">این فایل چه کاری انجام دهد؟</label>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="import-mode" id="import-mode-add" value="add">
                    <label class="form-check-label" for="import-mode-add">
                        <strong>افزودن به موارد موجود</strong>
                        <span class="d-block text-muted small">سوال‌های فایل به سوال‌های فعلی اضافه می‌شوند. چیزی حذف نمی‌شود.</span>
                    </label>
                </div>
                <div class="form-check mt-2">
                    <input class="form-check-input" type="radio" name="import-mode" id="import-mode-replace" value="replace">
                    <label class="form-check-label" for="import-mode-replace">
                        <strong class="text-danger">جایگزینی کامل</strong>
                        <span class="d-block text-muted small">تمام سوال‌های فعلی پاک و فقط محتوای این فایل جایگزین می‌شود. این عمل قابل بازگشت نیست.</span>
                    </label>
                </div>
                <div id="import-msg" class="mt-3"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                <button type="button" class="btn btn-primary" onclick="window.submitImport()">شروع وارد کردن</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block page_js %}
<script type="module">
    import { initQuestions } from '/static/admin/js/questions.js';
    initQuestions();
</script>
{% endblock %}
