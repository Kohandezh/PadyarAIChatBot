<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>تأیید کد | اینوتکس</title>
    <link href="/static/vendor/vazirmatn/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="/static/otp/otp.css" rel="stylesheet" type="text/css" />
    <!-- BRAND_CSS -->
    <!-- BRAND_CONFIG -->
</head>

<body>
    <main class="otp-stage" id="otp-stage" data-step="destination" data-state="initial">

        <!-- Pet-INOTEX companion: decorative; verification state is ALSO
             announced through the #otp-live region, never by the image alone. -->
        <div class="pet-slot" id="pet-slot" aria-hidden="true">
            <canvas id="pet-canvas" width="512" height="512"
                data-atlas="/static/otp/pet/inotex-pose-atlas-hd.webp" data-cell="512"></canvas>
        </div>

        <section class="otp-card" aria-labelledby="otp-title">
            <span class="card-studs" aria-hidden="true"><i></i><i></i></span>

            <header class="otp-card-header">
                <button type="button" class="back-btn" id="back-btn" title="بازگشت" data-i18n-title="back"
                    aria-label="بازگشت">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
                <div class="brand" aria-hidden="true">
                    <!-- BRAND_MARK -->
                    <span class="brand-name"><!-- BRAND_NAME --></span>
                </div>
                <button type="button" class="lang-btn" id="lang-btn" aria-label="Switch to English">EN</button>
            </header>

            <div class="hex-lock" aria-hidden="true">
                <svg viewBox="0 0 64 64" width="58" height="58">
                    <path d="M32 4 56 18v28L32 60 8 46V18Z" fill="#22335E" stroke="#2D5CA7" stroke-width="2.5"
                        stroke-linejoin="round" />
                    <rect x="24" y="28" width="16" height="13" rx="2.5" fill="#FCB715" />
                    <path d="M27 28v-4a5 5 0 0 1 10 0v4" fill="none" stroke="#FCB715" stroke-width="3" />
                </svg>
            </div>

            <!-- ── Step 1: destination ─────────────────────────────── -->
            <div class="step step-destination">
                <h1 class="otp-title" data-i18n="destTitle">شمارهٔ خود را وارد کنید</h1>
                <p class="otp-subtitle" data-i18n="destSubtitle">کد تأیید ۶ رقمی برای شما ارسال می‌شود.</p>
                <div class="dest-row" dir="ltr">
                    <input type="tel" id="dest-input" class="dest-input" inputmode="tel"
                        autocomplete="tel" placeholder="+98 912 000 0000"
                        aria-label="شماره تلفن همراه" />
                </div>
                <button type="button" class="verify-btn" id="send-code-btn">
                    <span class="btn-studs" aria-hidden="true"><i></i><i></i></span>
                    <span class="btn-label" data-i18n="sendCode">ارسال کد</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>
            </div>

            <!-- ── Step 2: code entry ──────────────────────────────── -->
            <div class="step step-code" hidden>
                <h1 class="otp-title" id="otp-title" data-i18n="title">تأیید کد</h1>
                <p class="otp-subtitle" id="otp-help">
                    <span data-i18n="subtitle">کد ۶ رقمی ارسال‌شده را وارد کنید</span>
                    <bdi class="dest-masked" id="dest-masked" dir="ltr"></bdi>
                </p>

                <div class="otp-digits" dir="ltr" role="group" aria-labelledby="otp-title"
                    aria-describedby="otp-help otp-live" id="otp-digits">
                    <!-- inputs are generated by otp.js so OTP_LENGTH stays configurable -->
                </div>

                <p class="otp-timer" id="otp-timer">
                    <span data-i18n="expires">زمان اعتبار کد</span>
                    <span class="timer-value" id="timer-value" dir="ltr">--:--</span>
                </p>

                <button type="button" class="verify-btn" id="verify-btn" disabled>
                    <span class="btn-studs" aria-hidden="true"><i></i><i></i></span>
                    <span class="btn-label" data-i18n="verify">تأیید</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>

                <div class="secondary-actions">
                    <button type="button" class="link-btn" id="resend-btn" disabled>
                        <span data-i18n="resend">ارسال مجدد کد</span>
                        <span class="resend-count" id="resend-count" dir="ltr" hidden></span>
                    </button>
                    <span class="or-sep" data-i18n="or">یا</span>
                    <button type="button" class="link-btn" id="change-btn" data-i18n="change">تغییر شماره</button>
                </div>
            </div>

            <!-- Feedback chip + SR live region -->
            <div class="feedback" id="feedback" hidden>
                <span class="feedback-icon" aria-hidden="true"></span>
                <span class="feedback-text" id="feedback-text"></span>
                <button type="button" class="feedback-close" id="feedback-close" aria-label="بستن">✕</button>
            </div>
            <p class="sr-only" id="otp-live" role="status" aria-live="polite"></p>

            <footer class="secure-note">
                <svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
                    <path d="M32 4 56 18v28L32 60 8 46V18Z" fill="none" stroke="#04A584" stroke-width="4"
                        stroke-linejoin="round" />
                    <path d="M23 32l6 6 12-12" fill="none" stroke="#04A584" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>
                    <strong data-i18n="secureTitle">تأیید امن</strong>
                    <span data-i18n="secureBody">کد شما نزد ما محفوظ است.</span>
                </span>
            </footer>
        </section>
    </main>

    <script src="/static/companion/companion.js"></script>
    <script src="/static/otp/otp.js"></script>
</body>

</html>
