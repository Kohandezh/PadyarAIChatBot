[pytest]
# Let `async def test_*` run without a per-test @pytest.mark.asyncio marker.
asyncio_mode = auto
# Tests live under tests/ (created when the first test is written).
testpaths = tests
# Put the repository root on sys.path.
#
# `python -m pytest` adds the working directory; a bare `pytest` does NOT. CI
# ran the bare form, so every module under tests/postgres/ failed to import
# with "No module named 'app'" — a green local run and a red CI one, from the
# invocation alone. Setting it here makes the two agree regardless of how
# anyone starts pytest.
pythonpath = .
